[package]
name = "bench_suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Criterion benchmark suite for Martensite core performance gates."
readme = "README.md"
publish = false
autobins = false

[dependencies]
martensite = { workspace = true }
martensite-core = { workspace = true }
martensite-reactive = { workspace = true }
# v0.18.0 competitive baselines: layout throughput, text shaping,
# virtualized table scroll. `taffy` is needed to name `taffy::Size`/
# `taffy::Style` directly — `martensite::layout::Size` shadows the taffy
# re-export (see F11 in examples/industrial_dashboard).
martensite-layout = { workspace = true }
martensite-text = { workspace = true }
martensite-blessed = { workspace = true }
taffy = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name = "bench_suite"
path = "src/main.rs"
harness = false
