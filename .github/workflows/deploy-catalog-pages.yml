name: Deploy Docs & Catalog

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs/site/**"
      - "examples/widget_catalog/**"
      - "crates/**/src/web.rs"
      - ".github/workflows/deploy-catalog-pages.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build site (docs + catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pages-wasm32"
      # opt-level "z" scoped to this step only (the workspace release
      # profile stays at 3): the catalog wasm bundle is served to every
      # Pages visitor, so size matters more than runtime throughput here.
      - name: Build widget catalog (wasm32)
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
        run: cargo build -p widget_catalog --target wasm32-unknown-unknown --release
      # Pinned to the wasm-bindgen crate version in the workspace lockfile
      # (examples/web convention): the CLI must match the library or glue
      # generation rejects the descriptor section.
      - name: Install wasm-bindgen-cli 0.2.128
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Assemble site staging
        run: |
          set -euo pipefail
          # Catalog bundle under staging/catalog/ — index.html loads
          # ./pkg/*.js and fetches ./assets/fonts/font.ttf relative to
          # itself, so it works verbatim under /martensite/catalog/.
          mkdir -p staging/catalog/pkg
          wasm-bindgen --target web \
            --out-dir staging/catalog/pkg \
            target/wasm32-unknown-unknown/release/widget_catalog.wasm
          cp examples/widget_catalog/web/index.html staging/catalog/
          cp -r examples/widget_catalog/web/assets staging/catalog/
          # Full documentation corpus at /martensite/docs/.
          cp -r docs staging/docs
          # docs/site holds this site's own source (landing page, Jekyll
          # config) — it is copied to the staging root below, not served
          # under /docs/.
          rm -rf staging/docs/site
          # Repo-root documents that docs/ pages link to via "../".
          cp README.md CONTRIBUTING.md CHANGELOG.md staging/
          cp LICENSE-MIT LICENSE-APACHE staging/
          # Landing page + Jekyll config (committed under docs/site/).
          cp docs/site/index.md staging/index.md
          cp docs/site/_config.yml staging/_config.yml
          # The github-pages gemset pins Jekyll 3.10, which ignores the
          # `render_with_liquid` front-matter default (Jekyll 4.x only).
          # Wrap every staged page in {% raw %}...{% endraw %} so the
          # corpus's literal `{{ }}`/`{% %}` samples survive Liquid.
          # YAML front matter stays at byte 0 where it exists.
          find staging -name '*.md' -print0 | while IFS= read -r -d '' f; do
            [ -s "$f" ] || continue
            awk 'NR==1 { if ($0 ~ /^---[[:space:]]*$/) { print; fm=1 } else { print "{% raw %}"; print }; next }
                 fm && $0 ~ /^(-{3}|\.\.\.)[[:space:]]*$/ { print; print "{% raw %}"; fm=0; next }
                 { print }
                 END { if (!fm) print "{% endraw %}" }' "$f" > "$f.tmp" \
              && mv "$f.tmp" "$f"
          done
      - uses: actions/configure-pages@v5
      # staging/ — not the repo root — is the Jekyll source so the build
      # never scans target/ or other non-site trees.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: staging
          destination: ./_site
      # The catalog is excluded in _config.yml and lands here untouched —
      # wasm/js/ttf ship byte-identical, outside Jekyll's pipeline.
      # jekyll-build-pages runs in a root-owned container, so _site lands
      # root-owned; reclaim it before copying.
      - name: Add catalog bundle to site
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          cp -r staging/catalog _site/catalog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
