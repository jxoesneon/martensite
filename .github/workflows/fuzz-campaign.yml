name: Fuzz Campaign

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly fuzz smoke run: every Sunday at 00:00 UTC.
    # The soak campaign never runs on schedule (see fuzz-soak below).
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which job to run"
        type: choice
        options:
          - smoke
          - soak
        default: smoke
        required: true
      soak_hours:
        description: >-
          Soak duration in hours (only used when mode=soak). GitHub-hosted
          runners hard-kill jobs at ~6h, so 6h is the maximum here; the full
          48h campaign is intended for self-hosted runners or local runs.
        type: choice
        options:
          - "1"
          - "3"
          - "6"
        default: "6"
        required: false
      seed:
        description: "Random seed (default: 1)"
        required: false
        default: "1"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: Fuzz Smoke Test (5 min)
    runs-on: ubuntu-latest
    # Generous budget for a cold-cache release build plus the 5-minute run.
    timeout-minutes: 60
    # Runs on push, PR, and the weekly schedule. On manual dispatch it only
    # runs when mode=smoke, so a soak dispatch does not duplicate it.
    # NOTE: the `inputs` context is unavailable on push/schedule events and
    # fails workflow validation, so read the dispatch payload via
    # `github.event.inputs` instead.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.mode == 'smoke'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      - name: Run fuzz smoke (5 min)
        run: |
          mkdir -p /tmp/fuzz-results
          cargo test --release -p martensite-test --lib soak_campaign -- --ignored --nocapture 2>&1 | tee /tmp/fuzz-results/fuzz-smoke-results.txt
        env:
          MARTENSITE_FUZZ_DURATION: "300"
          MARTENSITE_FUZZ_SEED: ${{ github.event.inputs.seed || '1' }}
          MARTENSITE_FUZZ_RELEASE: "1"
          MARTENSITE_FUZZ_RESULTS_DIR: "/tmp/fuzz-results"
      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-results
          path: /tmp/fuzz-results/
          retention-days: 7

  # The full fuzz campaign is 48 hours (MARTENSITE_FUZZ_DURATION=172800,
  # the default in crates/martensite-test/src/fuzz.rs) and is designed for
  # self-hosted runners or local execution. GitHub-hosted runners hard-kill
  # jobs at ~6 hours, so this job is manual-dispatch-only, capped at
  # timeout-minutes: 340, and the longest selectable duration is 6h (21600s).
  # If the job is killed at the timeout, `if: always()` on the upload step
  # still preserves partial results.
  fuzz-soak:
    name: Fuzz Soak Campaign (${{ github.event.inputs.soak_hours }}h)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'soak'
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      - name: Build fuzz test binary
        run: cargo test --release -p martensite-test --lib --no-run
      - name: Run soak campaign
        run: |
          mkdir -p /tmp/fuzz-results
          # GitHub expressions have no arithmetic operators, so the
          # hours -> seconds conversion happens in the shell.
          export MARTENSITE_FUZZ_DURATION=$(( ${SOAK_HOURS:-6} * 3600 ))
          cargo test --release -p martensite-test --lib soak_campaign -- --ignored --nocapture 2>&1 | tee /tmp/fuzz-results/fuzz-results.txt
        env:
          SOAK_HOURS: ${{ github.event.inputs.soak_hours }}
          MARTENSITE_FUZZ_SEED: ${{ github.event.inputs.seed || '1' }}
          MARTENSITE_FUZZ_RELEASE: "1"
          MARTENSITE_FUZZ_RESULTS_DIR: "/tmp/fuzz-results"
      - name: Upload fuzz campaign results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-soak-results-${{ github.run_id }}
          path: /tmp/fuzz-results/
          retention-days: 90
