name: Benchmark Verification & Documentation Sync

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'benches/**'
      - 'crates/**'
      - 'docs/BENCHMARKS.md'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'benches/**'
      - 'crates/**'
      - 'docs/BENCHMARKS.md'
      - 'README.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  benchmark-verification:
    name: Benchmark Strict Exit Gates & Doc Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1

      - name: Run Benchmark Suite (Test Mode & Strict Gates)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"

      - name: Clippy (benchmark crate, default features)
        run: cargo clippy -p bench_suite --all-targets -- -D warnings

      - name: Doc Tests (benchmark crate)
        run: cargo test --doc -p bench_suite --all-features

      - name: Generate and check benchmark crate documentation
        run: cargo doc -p bench_suite --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
