name: Benchmark Verification & Documentation Sync

on:
  push:
    branches: [main]
    paths:
      - 'benches/**'
      - 'crates/**'
      - 'docs/BENCHMARKS.md'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'benches/**'
      - 'crates/**'
      - 'docs/BENCHMARKS.md'
      - 'README.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  benchmark-verification:
    name: Benchmark Strict Exit Gates & Doc Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1

      - name: Run Benchmark Suite (Test Mode & Strict Gates)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"

      - name: Verify Documentation & README Consistency
        run: |
          echo "Verifying that published benchmark numbers match strict CI gates..."
          grep -q "0.00% (Kernel Sleep)" README.md || (echo "README.md missing idle CPU invariant" && exit 1)
          grep -q "< 0.8 ms" README.md || (echo "README.md missing 10k DAG propagation metric" && exit 1)
          grep -q "Steady 120 FPS / 0 alloc" README.md || (echo "README.md missing DataTable metric" && exit 1)
          grep -q "Suite 1: Reactive DAG Propagation Latency" docs/BENCHMARKS.md || (echo "docs/BENCHMARKS.md missing Suite 1" && exit 1)
          grep -q "Suite 5: Virtualized DataTable Scrolling" docs/BENCHMARKS.md || (echo "docs/BENCHMARKS.md missing Suite 5" && exit 1)
          echo "All benchmark documentation and README metrics verified successfully."
