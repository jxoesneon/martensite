name: Publish to crates.io

# Publishing to crates.io is the LAST step in the release pipeline.
# It only runs on version tags and is gated on ALL CI checks passing
# (formatting, clippy, tests, audit, deny, docs, benchmarks).
# No crate is published unless every gate is green.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run as dry-run (skip actual upload)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ──────────────────────────────────────────────────────────
  # CI GATES — all must pass before publishing
  # ──────────────────────────────────────────────────────────

  fmt-and-clippy:
    name: Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Run Tests (default features)
        run: cargo test --workspace --bins --lib --tests
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
      - name: Run Tests (all features)
        run: cargo test --workspace --all-features
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"

  supply-chain:
    name: Supply-Chain Gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  benchmarks:
    name: Benchmark Exit Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Benchmark Suite (test mode)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"

  # ──────────────────────────────────────────────────────────
  # PUBLISH — only runs after ALL CI gates pass
  # ──────────────────────────────────────────────────────────

  publish:
    name: Publish Crates (Dependency Order)
    runs-on: ubuntu-latest
    needs:
      - fmt-and-clippy
      - test-suite
      - supply-chain
      - audit
      - docs
      - benchmarks
    # Only publish on actual tag pushes (not workflow_dispatch dry-runs
    # unless explicitly requested).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run packaging
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          # Verify every publishable crate packages cleanly before any real publish.
          # Uses --no-verify because workspace path dependencies are not yet on crates.io.
          # Build validation is done by the CI gate jobs above.
          CRATES=(
            martensite-reactive
            martensite-macros
            martensite-core
            martensite-layout
            martensite-render
            martensite-wgpu
            martensite-cosmic-text
            martensite-text
            martensite-access
            martensite-window
            martensite-focus
            martensite-clipboard
            martensite-dnd
            martensite-theme
            martensite-test
            martensite-motion
            martensite-history
            martensite-l10n
            martensite-assets
            martensite-media
            martensite-devtools
            martensite
            martensite-blessed
          )
          for crate in "${CRATES[@]}"; do
            echo "Packaging $crate..."
            cargo package -p "$crate" --allow-dirty --no-verify
          done

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Crates in topological dependency order.
          # martensite-cosmic-text must come before martensite-text.
          CRATES=(
            martensite-reactive
            martensite-macros
            martensite-core
            martensite-layout
            martensite-render
            martensite-wgpu
            martensite-cosmic-text
            martensite-text
            martensite-access
            martensite-window
            martensite-focus
            martensite-clipboard
            martensite-dnd
            martensite-theme
            martensite-test
            martensite-motion
            martensite-history
            martensite-l10n
            martensite-assets
            martensite-media
            martensite-devtools
            martensite
            martensite-blessed
          )

          for crate in "${CRATES[@]}"; do
            echo "[$(date -u +%H:%M:%S)] Publishing $crate..."
            while true; do
              log="/tmp/publish_${crate}.log"
              # Use --no-verify for the initial release because workspace
              # path dependencies are published sequentially and may not
              # yet be visible in the crates.io index when the next crate
              # is verified. Build validation is done by CI gate jobs.
              if cargo publish -p "$crate" --no-verify > "$log" 2>&1; then
                echo "[$(date -u +%H:%M:%S)] $crate published."
                break
              fi
              if grep -q "already exists" "$log"; then
                echo "[$(date -u +%H:%M:%S)] $crate already published; skipping."
                break
              fi
              if grep -q "429 Too Many Requests" "$log"; then
                reset=$(grep -oE '[A-Za-z]+, [0-9]{2} [A-Za-z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' "$log" | head -1)
                wait=600
                if [ -n "$reset" ]; then
                  reset_epoch=$(TZ=UTC date -d "$reset" +%s 2>/dev/null || echo "")
                  now=$(TZ=UTC date +%s)
                  if [ -n "$reset_epoch" ] && [ "$((reset_epoch - now))" -gt 0 ]; then
                    wait=$((reset_epoch - now + 60))
                  fi
                fi
                echo "[$(date -u +%H:%M:%S)] Rate limited; waiting ${wait}s (reset: ${reset:-unknown})"
                sleep "$wait"
                continue
              fi
              echo "[$(date -u +%H:%M:%S)] FAILED: $crate"
              cat "$log"
              exit 1
            done
            # Wait between publishes for crates.io index propagation.
            sleep 180
          done
          echo "[$(date -u +%H:%M:%S)] All crates published."

  # ──────────────────────────────────────────────────────────
  # GITHUB RELEASE — create release notes after publishing
  # ──────────────────────────────────────────────────────────

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Find the section starting with "## [v${VERSION}]" or "## [${VERSION}]"
          # and capture until the next "## [" heading.
          awk -v ver="$VERSION" '
            /^## \[v?'"$VERSION"'\]/ { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            echo "No CHANGELOG section found for v${VERSION}; using default."
            echo "Release v${VERSION}" > /tmp/release_notes.md
          fi

          echo "## What's Changed" > /tmp/full_notes.md
          cat /tmp/release_notes.md >> /tmp/full_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/full_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
