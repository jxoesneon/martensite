name: Publish to crates.io

# Publishing to crates.io is the LAST step in the release pipeline.
# It only runs on version tags and is gated on ALL CI checks passing
# (formatting, clippy, tests, audit, deny, docs, benchmarks).
# No crate is published unless every gate is green.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run as dry-run (skip actual upload)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ──────────────────────────────────────────────────────────
  # CI GATES — all must pass before publishing
  # ──────────────────────────────────────────────────────────

  fmt-and-clippy:
    name: Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Run Tests (default features)
        run: cargo test --workspace --bins --lib --tests
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
      - name: Run Tests (all features)
        run: cargo test --workspace --all-features
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"

  supply-chain:
    name: Supply-Chain Gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  benchmarks:
    name: Benchmark Exit Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Benchmark Suite (test mode)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"

  # ──────────────────────────────────────────────────────────
  # PUBLISH — only runs after ALL CI gates pass
  # ──────────────────────────────────────────────────────────

  publish:
    name: Publish Crates (Dependency Order)
    runs-on: ubuntu-latest
    needs:
      - fmt-and-clippy
      - test-suite
      - supply-chain
      - audit
      - docs
      - benchmarks
    # Only publish on actual tag pushes (not workflow_dispatch dry-runs
    # unless explicitly requested).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run packaging
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          # Verify every publishable crate packages cleanly before any real publish.
          # Uses --no-verify because workspace path dependencies are not yet on crates.io.
          # Build validation is done by the CI gate jobs above.
          CRATES=(
            martensite-reactive
            martensite-macros
            martensite-core
            martensite-layout
            martensite-media
            martensite-render
            martensite-wgpu
            martensite-cosmic-text
            martensite-text
            martensite-access
            martensite-window
            martensite-focus
            martensite-clipboard
            martensite-dnd
            martensite-theme
            martensite-test
            martensite-motion
            martensite-history
            martensite-l10n
            martensite-assets
            martensite-devtools
            martensite
            martensite-blessed
          )
          for crate in "${CRATES[@]}"; do
            echo "Packaging $crate..."
            cargo package -p "$crate" --allow-dirty --no-verify
          done

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # ──────────────────────────────────────────────────────────
          # crates.io publishing rate limits (leaky bucket algorithm)
          # Reference: https://crates.io/docs/rate-limits
          #
          #   New crates (brand new):       burst=5,   refill=1 per 600s
          #   New versions (existing):      burst=30,  refill=1 per  60s
          #
          # 429 responses include a Retry-After header and a detail
          # message with the next-allowed timestamp.
          # ──────────────────────────────────────────────────────────

          NEW_CRATE_BURST=5
          NEW_CRATE_REFILL=600    # 10 minutes
          NEW_VERSION_BURST=30
          NEW_VERSION_REFILL=60   # 1 minute
          INDEX_PROPAGATION_DELAY=10  # minimum delay for index propagation

          # Leaky bucket state (token count + last refill epoch).
          new_crate_tokens=$NEW_CRATE_BURST
          new_version_tokens=$NEW_VERSION_BURST
          new_crate_last_refill=$(TZ=UTC date +%s)
          new_version_last_refill=$(TZ=UTC date +%s)

          # Refill tokens based on elapsed time since last refill.
          # Uses arithmetic on the captured-by-reference variables.
          refill_tokens() {
            local now elapsed new_added ver_added
            now=$(TZ=UTC date +%s)

            elapsed=$((now - new_crate_last_refill))
            new_added=$((elapsed / NEW_CRATE_REFILL))
            if [ "$new_added" -gt 0 ]; then
              new_crate_tokens=$((new_crate_tokens + new_added))
              if [ "$new_crate_tokens" -gt "$NEW_CRATE_BURST" ]; then
                new_crate_tokens=$NEW_CRATE_BURST
              fi
              new_crate_last_refill=$((new_crate_last_refill + new_added * NEW_CRATE_REFILL))
            fi

            elapsed=$((now - new_version_last_refill))
            ver_added=$((elapsed / NEW_VERSION_REFILL))
            if [ "$ver_added" -gt 0 ]; then
              new_version_tokens=$((new_version_tokens + ver_added))
              if [ "$new_version_tokens" -gt "$NEW_VERSION_BURST" ]; then
                new_version_tokens=$NEW_VERSION_BURST
              fi
              new_version_last_refill=$((new_version_last_refill + ver_added * NEW_VERSION_REFILL))
            fi
          }

          # Consume a token for the given crate type and sleep if the
          # bucket is empty. Returns the sleep duration via stdout.
          consume_token() {
            local is_new="$1"
            refill_tokens
            if [ "$is_new" = "1" ]; then
              if [ "$new_crate_tokens" -gt 0 ]; then
                new_crate_tokens=$((new_crate_tokens - 1))
                echo 0
              else
                # Wait until the next token refills.
                local now next_refill wait
                now=$(TZ=UTC date +%s)
                next_refill=$((new_crate_last_refill + NEW_CRATE_REFILL))
                wait=$((next_refill - now + 5))
                if [ "$wait" -lt 1 ]; then wait=1; fi
                # After waiting, refill and consume.
                sleep "$wait"
                refill_tokens
                new_crate_tokens=$((new_crate_tokens - 1))
                echo "$wait"
              fi
            else
              if [ "$new_version_tokens" -gt 0 ]; then
                new_version_tokens=$((new_version_tokens - 1))
                echo 0
              else
                local now next_refill wait
                now=$(TZ=UTC date +%s)
                next_refill=$((new_version_last_refill + NEW_VERSION_REFILL))
                wait=$((next_refill - now + 5))
                if [ "$wait" -lt 1 ]; then wait=1; fi
                sleep "$wait"
                refill_tokens
                new_version_tokens=$((new_version_tokens - 1))
                echo "$wait"
              fi
            fi
          }

          # Target version is the workspace package version.
          WORKSPACE_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/^version *= *"\(.*\)".*/\1/')
          echo "[$(date -u +%H:%M:%S)] Workspace version: ${WORKSPACE_VERSION}"

          # Crates in topological dependency order.
          # martensite-cosmic-text must come before martensite-text.
          CRATES=(
            martensite-reactive
            martensite-macros
            martensite-core
            martensite-layout
            martensite-media
            martensite-render
            martensite-wgpu
            martensite-cosmic-text
            martensite-text
            martensite-access
            martensite-window
            martensite-focus
            martensite-clipboard
            martensite-dnd
            martensite-theme
            martensite-test
            martensite-motion
            martensite-history
            martensite-l10n
            martensite-assets
            martensite-devtools
            martensite
            martensite-blessed
          )

          TARGET_VERSION="$WORKSPACE_VERSION"

          published=0
          for crate in "${CRATES[@]}"; do
            # Pre-check: query crates.io API for the crate's max published
            # version. If TARGET_VERSION is already published, skip immediately
            # without invoking cargo publish or sleeping.
            api_url="https://crates.io/api/v1/crates/${crate}"
            # Use `|| true` on the pipeline so that crates with no stable
            # version (e.g. pre-release-only like martensite-cosmic-text) or
            # crates not yet on crates.io don't abort the script under
            # `set -euo pipefail`. grep returns exit code 1 when there is no
            # match, which is a normal condition here.
            existing=$( (curl -fsSL -A "martensite-ci (https://github.com/jxoesneon/martensite)" "$api_url" 2>/dev/null \
              | grep -oE '"max_stable_version":"[^"]*"' | head -1 \
              | sed 's/"max_stable_version":"//;s/"//') || true )
            if [ "$existing" = "$TARGET_VERSION" ]; then
              echo "[$(date -u +%H:%M:%S)] $crate ${TARGET_VERSION} already on crates.io; skipping."
              continue
            fi

            # Determine if this is a new crate or a new version of an
            # existing crate. A crate is "new" if the API returns no
            # max_stable_version (empty $existing means not on crates.io).
            is_new_crate=0
            if [ -z "$existing" ]; then
              is_new_crate=1
              echo "[$(date -u +%H:%M:%S)] $crate: NEW crate (not on crates.io), target=${TARGET_VERSION}; publishing..."
            else
              echo "[$(date -u +%H:%M:%S)] $crate: latest=${existing}, target=${TARGET_VERSION}; publishing..."
            fi

            # Consume a rate-limit token, sleeping if the bucket is empty.
            waited=$(consume_token "$is_new_crate")
            if [ "$waited" -gt 0 ]; then
              echo "[$(date -u +%H:%M:%S)] Rate limit bucket empty; waited ${waited}s for token refill."
            fi
            echo "[$(date -u +%H:%M:%S)] Tokens remaining — new crates: ${new_crate_tokens}/${NEW_CRATE_BURST}, new versions: ${new_version_tokens}/${NEW_VERSION_BURST}"

            while true; do
              log="/tmp/publish_${crate}.log"
              # Use --no-verify for the initial release because workspace
              # path dependencies are published sequentially and may not
              # yet be visible in the crates.io index when the next crate
              # is verified. Build validation is done by CI gate jobs.
              if cargo publish -p "$crate" --no-verify > "$log" 2>&1; then
                echo "[$(date -u +%H:%M:%S)] $crate published."
                break
              fi
              if grep -q "already exists" "$log"; then
                echo "[$(date -u +%H:%M:%S)] $crate already published; skipping."
                break
              fi
              if grep -q "429 Too Many Requests" "$log"; then
                # The 429 response includes a detail message with the
                # next-allowed timestamp. Parse it to compute the exact
                # wait time. Fall back to the appropriate refill interval.
                reset=$(grep -oE '[A-Za-z]+, [0-9]{2} [A-Za-z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' "$log" | head -1)
                # Also try the ISO 8601 format (2024-01-01T00:00:00Z).
                if [ -z "$reset" ]; then
                  reset=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' "$log" | head -1)
                  if [ -n "$reset" ]; then
                    reset_epoch=$(TZ=UTC date -d "$reset" +%s 2>/dev/null || echo "")
                  fi
                else
                  reset_epoch=$(TZ=UTC date -d "$reset" +%s 2>/dev/null || echo "")
                fi
                # Default wait based on crate type.
                if [ "$is_new_crate" = "1" ]; then
                  wait=$NEW_CRATE_REFILL
                else
                  wait=$NEW_VERSION_REFILL
                fi
                if [ -n "${reset_epoch:-}" ]; then
                  now=$(TZ=UTC date +%s)
                  if [ "$((reset_epoch - now))" -gt 0 ]; then
                    wait=$((reset_epoch - now + 5))
                  fi
                fi
                echo "[$(date -u +%H:%M:%S)] Rate limited (429); waiting ${wait}s (reset: ${reset:-unknown})"
                sleep "$wait"
                # Refill tokens after waiting.
                refill_tokens
                continue
              fi
              echo "[$(date -u +%H:%M:%S)] FAILED: $crate"
              cat "$log"
              exit 1
            done
            published=$((published + 1))
            # Minimum delay for crates.io index propagation between
            # successive publishes. This is separate from rate limiting.
            sleep "$INDEX_PROPAGATION_DELAY"
          done
          echo "[$(date -u +%H:%M:%S)] All crates processed. Newly published: ${published}."

  # ──────────────────────────────────────────────────────────
  # GITHUB RELEASE — create release notes after publishing
  # ──────────────────────────────────────────────────────────

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Find the section starting with "## [v${VERSION}]" or "## [${VERSION}]"
          # and capture until the next "## [" heading.
          awk -v ver="$VERSION" '
            /^## \[v?'"$VERSION"'\]/ { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            echo "No CHANGELOG section found for v${VERSION}; using default."
            echo "Release v${VERSION}" > /tmp/release_notes.md
          fi

          echo "## What's Changed" > /tmp/full_notes.md
          cat /tmp/release_notes.md >> /tmp/full_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/full_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
