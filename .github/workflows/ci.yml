name: Martensite CI Pipeline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  # No `tags:` trigger — publish.yml invokes this pipeline via
  # workflow_call on every version tag, so a direct tag trigger would
  # run the entire suite twice per release.
  pull_request:
    branches: [main]
  # Allow the publish workflow to reuse this pipeline without duplicating jobs.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  style-and-lints:
    name: Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Pango/Cairo + FFmpeg/libva (text-reference + decoder backends)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Lints (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy Lints (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  version-consistency:
    name: Version Surface Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The matrix generator shells out to `cargo metadata` — install the
      # pinned toolchain (rust-toolchain.toml pulls rust-src + targets,
      # which the bare runner rustup fails to fetch on demand).
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version surfaces
        run: bash scripts/check-version-consistency.sh
      # Publish-order + publishable-set gate on every PR: a dependency
      # edge that would invert the release order fails here, long before
      # the tag exists. Same script the publish workflow consumes.
      - name: Verify publish order & publishable predicate
        run: python3 scripts/workspace-matrix.py publish-order | python3 scripts/workspace-matrix.py check

  purity-and-bans:
    name: Supply-Chain Gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  cargo-vet:
    name: Supply-Chain Vet (cargo-vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          # imports.lock publisher entries carry `user-id` fields, which
          # cargo-vet < 0.10.1 cannot parse — pin the version that wrote it.
          tool: cargo-vet@0.10.2
      - name: Run cargo-vet
        run: cargo vet --locked

  # Tests run under cargo-nextest, hash-partitioned across a matrix of
  # shards — each shard is an independent runner. Per-test process
  # isolation makes most suites safer; tests that share an OS singleton
  # (the real system clipboard) are serialized via the `system-clipboard`
  # test-group in .config/nextest.toml. The test-parity job below
  # guards against silently dropping tests in the migration.
  test-suite:
    name: Test Suite (${{ matrix.features }} · ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # A failing shard must not cancel the others — all results matter.
      fail-fast: false
      matrix:
        features: [default, all-features]
        shard: ["1", "2", "3", "4", "5", "6"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One warm cache per feature leg feeds all six shards; shards
          # share compile artifacts instead of building in serial legs.
          shared-key: "tests-${{ matrix.features }}"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Install Pango/Cairo + FFmpeg/libva (text-reference + decoder backends)
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      # Per AGENTS.md, both feature sets must be tested. Feature-gated code
      # paths that need real hardware stay safe under --all-features: GPU
      # tests are #[ignore]d, wgpu tests use the noop device (test-noop),
      # shell backends are all(target_os, feature)-gated, and clipboard
      # falls back to a stub when no native backend is available.
      - name: Run Tests (${{ matrix.features }})
        run: >-
          cargo nextest run --workspace
          --partition hash:${{ matrix.shard }}/6
          ${{ matrix.features == 'all-features' && '--all-features' || '--bins --lib --tests' }}
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"

  # Nextest never runs doctests — they stay on `cargo test --doc`, sharded
  # by package group so the per-doc compile/link work parallelizes.
  # mold links each doctest binary several times faster than GNU ld.
  doc-tests:
    name: Doc Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    env:
      # Overrides the workflow-level RUSTFLAGS for this job only.
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "doctests"
      - name: Install mold + Pango/Cairo + FFmpeg/libva (--all-features)
        run: |
          sudo apt-get update
          sudo apt-get install -y mold libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      - name: Run Doc Tests
        run: |
          mapfile -t PKGS < <(python3 scripts/workspace-matrix.py doctest-group "${{ matrix.shard }}" 4)
          cargo test --doc --all-features $(printf -- '-p %s ' "${PKGS[@]}")

  # Permanent guard: the nextest run must see exactly the same test count
  # as libtest's `--list`. A test silently dropped by a filter, partition,
  # or target-selection bug fails this job on every PR.
  test-parity:
    name: Test-Count Parity (libtest vs nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install Mesa + Pango/Cairo + FFmpeg/libva (workspace compiles)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 \
            libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      - name: Compare test counts
        run: |
          libtest=$(cargo test --workspace --bins --lib --tests -- --list 2>/dev/null | grep -c ': test$')
          nextest=$(cargo nextest list --workspace --bins --lib --tests --message-format json | jq '.["test-count"]')
          echo "libtest: $libtest   nextest: $nextest"
          test "$libtest" = "$nextest"

  # Ignored GPU/hardware tests stay on libtest — `-- --ignored` is a
  # libtest flag; under nextest the equivalent is --run-ignored, but
  # these serial hardware probes gain nothing from per-process
  # parallelism and libtest is already installed here.
  ignored-tests:
    name: Ignored GPU / Hardware Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Install Pango/Cairo + FFmpeg/libva (text-reference + decoder backends)
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      - name: Install Wayland dev headers (for wayland-sys build script)
        run: |
          sudo apt-get install -y libwayland-dev
      - name: Run ignored tests
        run: |
          cargo test -p martensite-wgpu --lib -- --ignored
          cargo test -p martensite-window --lib -- --ignored
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
      - name: GPU/CPU parity (Lavapipe)
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
        run: cargo test -p martensite-render-test --test parity -- --ignored

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Pango/Cairo + FFmpeg/libva (text-reference + decoder backends)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      - name: Build Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  benchmarks:
    name: Benchmark Exit Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Benchmark Suite (strict exit gates)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"
      - name: Generate and check benchmark crate documentation
        run: cargo doc -p bench_suite --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  performance-gates:
    name: Performance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Install Pango/Cairo + FFmpeg/libva (text-reference + decoder backends)
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config \
            libva-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev \
            libavformat-dev
      # Runs #[ignore]-gated performance tests in release mode with
      # MARTENSITE_STRICT_BENCH=1. Only the crates that have #[ignore]-gated
      # perf tests are compiled (not the entire workspace) to keep CI time
      # reasonable. Release mode is required because the layout perf
      # thresholds are calibrated against optimized builds; debug-mode Taffy
      # is ~10-50x slower and would false-fail.
      - name: Performance gates
        env:
          MARTENSITE_STRICT_BENCH: "1"
          WGPU_ADAPTER_NAME: "llvmpipe"
        run: |
          cargo test --release -p martensite-layout --lib -- --ignored
          cargo test --release -p martensite-wgpu --lib -- --ignored
          cargo test --release -p martensite-render --features vello -- --ignored
          cargo test --release -p martensite-devtools --lib -- --ignored
          # Text cache hit-rate gates (Tier 1 + Tier 2).
          cargo test --release -p martensite --lib -- --ignored
          # Kalman stylus per-event latency gate (2.0 ms avg). The sibling
          # ignored test `create_and_destroy_real_window` self-skips when
          # headless (no display server).
          cargo test --release -p martensite-window --lib -- --ignored
          # 1M-row steady-scroll budget (8.3 ms/frame) + docking zero-alloc.
          cargo test --release -p martensite-blessed --lib -- --ignored
          cargo test --release -p martensite-blessed --test docking_zero_alloc -- --ignored
          # Rubber-band scroller zero-alloc gate.
          cargo test --release -p martensite-motion --test rubber_band_zero_alloc -- --ignored
          # Theme-transition zero-alloc gate (per-frame uniform path).
          cargo test --release -p martensite-theme --test theme_transition_zero_alloc -- --ignored
          # Hot-reload pipeline latency gate (<350 ms); spawns a nested
          # `cargo build` of a minimal guest cdylib — no network needed.
          cargo test --release -p martensite-host --test hot_reload_latency -- --ignored

  shell-linux-integration:
    name: Shell Integration (Linux D-Bus + Wayland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install D-Bus and Weston
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 weston \
            pkg-config libdbus-1-dev
      - name: Run shell integration tests (non-ignored)
        run: cargo test -p martensite-shell --features wayland-backend --test shell_integration
      - name: Run shell integration tests (D-Bus ignored)
        run: |
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          cargo test -p martensite-shell --features wayland-backend --test shell_integration -- --ignored
        continue-on-error: true

  shell-windows-integration:
    name: Shell Integration (Windows DWM + Snap)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build shell crate (windows-backend)
        run: cargo build -p martensite-shell --features windows-backend
      - name: Run shell doctests (windows-backend)
        run: cargo test -p martensite-shell --features windows-backend --doc
      - name: Run shell unit tests (windows-backend)
        run: cargo test -p martensite-shell --features windows-backend --lib
      - name: Build workspace (windows-backend)
        # martensite-text-reference is permanently excluded: it is a
        # publish=false Pango/Cairo reference-oracle crate whose system
        # libraries (glib/pango/cairo via pkg-config) do not exist on
        # Windows runners. martensite-font-fallback rejoins the build —
        # its windows 0.61 DirectWrite mismatch was fixed in e15f1ea.
        run: cargo build --workspace --features martensite-shell/windows-backend --exclude martensite-text-reference
      - name: Clippy (windows-backend)
        run: cargo clippy -p martensite-shell --features windows-backend --all-targets -- -D warnings

  ffi-macos-check:
    name: FFI Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The unsafe-code FFI exceptions only compile their platform code on
      # the matching target; this job gives them macOS build coverage.
      - name: Check martensite-shell (macos-backend)
        run: cargo check -p martensite-shell --features macos-backend --all-targets
      - name: Check martensite-font-fallback (CoreText)
        run: cargo check -p martensite-font-fallback --all-targets
      - name: Check martensite-media-platform (IOSurface)
        run: cargo check -p martensite-media-platform --all-targets
      - name: Check VideoToolbox decoder backend
        run: cargo check -p martensite-media-platform --features decoder-videotoolbox --all-targets

  ffi-windows-check:
    name: FFI Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check martensite-shell (windows-backend)
        run: cargo check -p martensite-shell --features windows-backend --all-targets
      - name: Check martensite-font-fallback (DirectWrite)
        run: cargo check -p martensite-font-fallback --all-targets
      - name: Check martensite-media-platform (DXGI)
        run: cargo check -p martensite-media-platform --all-targets
      - name: Check Media Foundation decoder backend
        run: cargo check -p martensite-media-platform --features decoder-mf --all-targets

  adapters:
    name: Heavy Adapters (Bevy + Godot)
    runs-on: ubuntu-latest
    # The adapter crates and the showcase example are excluded from the
    # default workspace (root Cargo.toml `exclude`). They pull heavyweight
    # dependencies (bevy git pin, godot gdext), so this job is skipped on
    # pull requests to keep PR CI fast; it still runs on main/tag pushes
    # and on publish gates via `workflow_call`.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - crates/martensite-bevy/Cargo.toml
          - crates/martensite-godot/Cargo.toml
          - examples/viewport_showcase/Cargo.toml
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "adapters-${{ matrix.manifest }}"
      - name: Check ${{ matrix.manifest }}
        run: cargo check --manifest-path ${{ matrix.manifest }}
      - name: Clippy ${{ matrix.manifest }}
        run: cargo clippy --manifest-path ${{ matrix.manifest }} --all-targets -- -D warnings
      # viewport_showcase links a test binary — bevy/winit on Linux needs
      # X11/XCB/wayland/alsa/udev dev packages present on the runner.
      # The rlib-only manifests don't link, so they skip this step.
      - name: Install Linux link deps (viewport_showcase)
        if: matrix.manifest == 'examples/viewport_showcase/Cargo.toml'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libasound2-dev libudev-dev libwayland-dev
      # martensite-godot is a cdylib; its unit tests run through the rlib.
      - name: Test ${{ matrix.manifest }}
        run: cargo test --manifest-path ${{ matrix.manifest }}
      # `render_publishes_into_ring` in host.rs is
      # `#[cfg(feature = "test-noop")]`-gated: it exercises the host-side
      # publish path on wgpu's `noop` backend, so no GPU is required.
      - name: Test martensite-godot (test-noop)
        if: matrix.manifest == 'crates/martensite-godot/Cargo.toml'
        run: cargo test --manifest-path crates/martensite-godot/Cargo.toml --features test-noop

  target-checks:
    name: Target Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wasm32
            os: ubuntu-latest
            target: wasm32-unknown-unknown
            crates: -p martensite-window -p martensite-access -p martensite-dnd -p martensite-clipboard -p martensite-text -p martensite-wgpu -p martensite
          - name: ios-sim
            os: macos-latest
            target: aarch64-apple-ios-sim
            crates: -p martensite-access-platform -p martensite-accesskit-winit -p martensite-access -p martensite-window -p martensite-wgpu -p ios_demo
          - name: android
            os: ubuntu-latest
            target: aarch64-linux-android
            crates: -p martensite-access-platform -p martensite-accesskit-winit -p martensite-access -p martensite-window -p martensite-wgpu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "target-${{ matrix.target }}"
      # android-activity's build script compiles C glue; point it at the
      # runner's preinstalled NDK toolchain (API 24 floor per packaging doc).
      - name: Configure Android NDK toolchain
        if: matrix.name == 'android'
        run: |
          echo "CC_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: cargo check --target ${{ matrix.target }}
        run: cargo check --target ${{ matrix.target }} --all-targets ${{ matrix.crates }}

  # Mechanical API-freeze enforcement (milestone v0.18.0 §4.1).
  #
  # Baseline strategy: cargo-semver-checks' registry default — every crate is
  # compared against its most recently published crates.io version (v0.17.0
  # today). Two design points keep this gate honest without breaking the
  # pipeline:
  #
  #   1. Scope: all non-vendored publishable crates with a library target
  #      (42 — martensite-macros is proc-macro-only and excluded). The
  #      three vendored
  #      forks (martensite-vello, martensite-cosmic-text,
  #      martensite-accesskit-winit) are excluded because their surface
  #      tracks upstream and is re-synced rather than frozen — the
  #      accesskit-winit exclusion is on that vendored rationale alone
  #      (it uses `version.workspace = true`). Only vello
  #      (0.10.0-martensite.1) and cosmic-text (0.19.0-martensite.1)
  #      carry `-martensite.N` prerelease versions off the workspace
  #      bump cadence. Checking all 42 non-vendored publishable crates against
  #      crates.io baselines is feasible only because each matrix leg
  #      is an independent parallel job; a serial `--workspace` run
  #      would not fit in the pipeline.
  #   2. Strictness: the check is *blocking* only once the workspace version
  #      has been bumped past the published baseline — i.e. on release
  #      branches, tag pushes, and the publish gate (workflow_call). While
  #      `version == baseline` mid-cycle, breaking changes are permitted
  #      under 0.x semver policy, so failures are reported advisory-only
  #      (continue-on-error) instead of failing the build.
  #
  # Feature-gated API (vello backend, decoder-*, devtools-timemachine, shell
  # backends) is not covered: the check runs with explicit
  # `--default-features` — without the flag, cargo-semver-checks applies an
  # all-features-except-unstable heuristic that would pull in
  # decoder-ffmpeg/decoder-vaapi and fail for want of libva/ffmpeg dev
  # packages. `--all-features` is likewise out: it needs platform system
  # libraries and cfg-gated targets that don't exist on this runner.
  # Full-coverage checks can be run locally with
  # `cargo semver-checks --workspace --all-features` on a Linux host
  # with the CI system packages installed.
  # Single source of truth for crate enumerations: the semver matrix is
  # generated from cargo metadata (publishable + lib target + tracks the
  # workspace version). New crates are picked up automatically —
  # martensite-macros (proc-macro, no lib) and the independently-versioned
  # vendored forks (vello, cosmic-text) are excluded by construction.
  workspace-matrix:
    name: Workspace Matrix
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.emit.outputs.semver }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - id: emit
        run: |
          crates=$(python3 scripts/workspace-matrix.py semver-checks | jq -R -s -c 'split("\n")[:-1]')
          echo "semver={\"crate\":$crates}" >> "$GITHUB_OUTPUT"

  semver-checks:
    name: Semver Checks (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: workspace-matrix
    # Mirrors the `adapters` job pattern: skip on ordinary PRs to keep them
    # fast; still runs on main pushes, tags, the publish gate, and
    # release/* PRs where a bumped version makes the gate strict.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.workspace-matrix.outputs.semver) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "semver-${{ matrix.crate }}"
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # martensite-font-fallback's baseline crate links fontconfig-sys on
      # Linux; the .pc file lives in the -dev package. martensite-access
      # (via accesskit_winit → winit) builds wayland-sys, which needs the
      # Wayland dev headers — same install as the ignored-tests job.
      - name: Install fontconfig + Wayland headers (baseline builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev
      # Blocking only once the manifest version exceeds the published
      # baseline (release bump landed). While versions match, report
      # advisory-only so permitted mid-cycle API changes don't go red.
      - name: Determine gate strictness
        id: gate
        run: |
          WS_VER=$(awk '/^\[workspace\.package\]/{p=1;next}/^\[/{p=0}p&&/^version/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          # `( ... ) || true` keeps a curl/grep failure (e.g. a crate never
          # published to crates.io) from aborting the step under
          # `bash -eo pipefail`. Same idiom as publish.yml.
          BASE=$( (curl -fsSL -A "martensite-ci (https://github.com/jxoesneon/martensite)" \
            "https://crates.io/api/v1/crates/${{ matrix.crate }}" \
            | grep -oE '"max_version":"[^"]*"' | head -1 \
            | sed 's/.*:"//;s/"$//') || true )
          echo "workspace=${WS_VER} baseline=${BASE:-<none>}"
          # Crates not yet on crates.io have no baseline to diff against;
          # semver-checks would fail outright, so the check step below is
          # skipped until the first publish lands a baseline.
          if [ -z "$BASE" ]; then
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$BASE" ] || [ "$WS_VER" != "$BASE" ]; then
            echo "strict=true" >> "$GITHUB_OUTPUT"
          else
            echo "strict=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check ${{ matrix.crate }} against crates.io baseline
        if: ${{ steps.gate.outputs.has_baseline == 'true' }}
        continue-on-error: ${{ steps.gate.outputs.strict != 'true' }}
        env:
          # The workflow-wide RUSTFLAGS "-D warnings" must not apply to the
          # *baseline* crate build: upstream-published sources may emit
          # warnings that would abort rustdoc generation for reasons
          # unrelated to API changes.
          RUSTFLAGS: ""
        # --manifest-path rather than -p: the stubs/ namespace-reservation
        # crates reuse real names (stubs/martensite collides with
        # crates/martensite) and -p resolution is ambiguous for them.
        run: cargo semver-checks --manifest-path crates/${{ matrix.crate }}/Cargo.toml --default-features

