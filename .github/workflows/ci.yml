name: Martensite CI Pipeline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  # Allow the publish workflow to reuse this pipeline without duplicating jobs.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  style-and-lints:
    name: Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Lints (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy Lints (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  purity-and-bans:
    name: Supply-Chain Gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      - name: Run Tests
        run: cargo test --workspace --bins --lib --tests
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
      - name: Media interop (noop)
        run: cargo test -p martensite-media-test --features test-noop --test interop
      - name: Run Doc Tests
        run: cargo test --doc --workspace --all-features

  ignored-tests:
    name: Ignored GPU / Hardware Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      - name: Run ignored tests
        run: |
          cargo test -p martensite-wgpu --lib -- --ignored
          cargo test -p martensite-window --lib -- --ignored
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
      - name: GPU/CPU parity (Lavapipe)
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"
        run: cargo test -p martensite-render-test --test parity -- --ignored

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      - name: Build Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  benchmarks:
    name: Benchmark Exit Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Benchmark Suite (strict exit gates)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"
      - name: Generate and check benchmark crate documentation
        run: cargo doc -p bench_suite --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  performance-gates:
    name: Performance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Install Pango/Cairo (for martensite-text-reference)
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config
      # Runs #[ignore]-gated performance tests in release mode with
      # MARTENSITE_STRICT_BENCH=1. Only the crates that have #[ignore]-gated
      # perf tests are compiled (not the entire workspace) to keep CI time
      # reasonable. Release mode is required because the layout perf
      # thresholds are calibrated against optimized builds; debug-mode Taffy
      # is ~10-50x slower and would false-fail.
      - name: Performance gates
        env:
          MARTENSITE_STRICT_BENCH: "1"
          WGPU_ADAPTER_NAME: "llvmpipe"
        run: |
          cargo test --release -p martensite-layout --lib -- --ignored
          cargo test --release -p martensite-wgpu --lib -- --ignored
          cargo test --release -p martensite-render --features vello -- --ignored
          cargo test --release -p martensite-devtools --lib -- --ignored

  shell-linux-integration:
    name: Shell Integration (Linux D-Bus + Wayland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install D-Bus and Weston
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 weston \
            pkg-config libdbus-1-dev
      - name: Run shell integration tests (non-ignored)
        run: cargo test -p martensite-shell --features wayland-backend --test shell_integration
      - name: Run shell integration tests (D-Bus ignored)
        run: |
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          cargo test -p martensite-shell --features wayland-backend --test shell_integration -- --ignored
        continue-on-error: true

  shell-windows-integration:
    name: Shell Integration (Windows DWM + Snap)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build shell crate (windows-backend)
        run: cargo build -p martensite-shell --features windows-backend
      - name: Run shell doctests (windows-backend)
        run: cargo test -p martensite-shell --features windows-backend --doc
      - name: Run shell unit tests (windows-backend)
        run: cargo test -p martensite-shell --features windows-backend --lib
      - name: Build workspace (windows-backend)
        run: cargo build --workspace --features martensite-shell/windows-backend
      - name: Clippy (windows-backend)
        run: cargo clippy -p martensite-shell --features windows-backend --all-targets -- -D warnings

