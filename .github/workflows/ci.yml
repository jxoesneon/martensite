name: Martensite CI Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  style-and-lints:
    name: Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  purity-and-bans:
    name: Supply-Chain Gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mesa Lavapipe (Software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1
      - name: Run Tests
        run: cargo test --workspace --bins --lib --tests
        env:
          WGPU_ADAPTER_NAME: "llvmpipe"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  benchmarks:
    name: Benchmark Exit Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Benchmark Suite (strict exit gates)
        run: cargo bench -p bench_suite --bench bench_suite -- --test
        env:
          MARTENSITE_STRICT_BENCH: "1"
      - name: Verify Benchmark Documentation Consistency
        run: |
          grep -q "0.00% (Kernel Sleep)" README.md || (echo "README.md missing benchmark metrics" && exit 1)
          grep -q "< 0.8 ms" README.md || (echo "README.md missing 10k DAG metric" && exit 1)
          grep -q "Suite 1: Reactive DAG Propagation Latency" docs/BENCHMARKS.md || (echo "docs/BENCHMARKS.md missing Suite 1" && exit 1)
          echo "Benchmark documentation verified against CI/CD exit gates."

