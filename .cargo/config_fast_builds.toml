# Fast build configuration template for developers with `mold` installed on Linux.
# Copy or merge into `.cargo/config.toml` (or `~/.cargo/config.toml` for user-global speed).
#
# Prerequisites on Linux:
#   Debian/Ubuntu: sudo apt-get install mold clang
#   Arch/CachyOS:  sudo pacman -S mold clang
#   Fedora:        sudo dnf install mold clang

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.x86_64-apple-darwin]
rustflags = ["-C", "split-debuginfo=unpacked"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "split-debuginfo=unpacked"]

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
