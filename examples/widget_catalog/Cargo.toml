[package]
name = "widget_catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Comprehensive widget catalog and developer reference for Martensite."
publish = false

# `cdylib` for wasm-bindgen; `rlib` so `cargo check`/`cargo test` and the
# host binary link the crate as a normal library.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Browser-side dev channel (ADR-0042): a wasm32-only opt-in that dials the
# `cargo martensite dev-web` relay over `ws://127.0.0.1` and serves the
# dev-session protocol (tree/lint/signals/events/a11y) to local tooling.
# Off by default — public web builds carry none of the transport.
web-dev = ["martensite-devtools/web-dev-channel"]

[dependencies]
martensite = { workspace = true, features = [
    # Signal enumeration for `signals_list`/`signal_trigger`.
    "devtools-timemachine"
] }

martensite-core = { workspace = true }
martensite-engine-bridge = { workspace = true }
martensite-reactive = { workspace = true }
martensite-theme = { workspace = true }
martensite-layout = { workspace = true }
martensite-render = { workspace = true }
# `render` gives the dev-session probe the TinySkia raster path so
# `capture_node` produces real PNGs under `--live-headless` too.
martensite-devtools = { workspace = true, features = ["render"] }
martensite-wgpu = { workspace = true, features = ["vello"] }
martensite-design-lint = { workspace = true }
accesskit = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# winit/wgpu pins mirror examples/industrial_dashboard — the vendored
# accesskit_winit fork and the wgpu engine build against these.
winit = { version = "0.31.0-beta.3", default-features = false, features = ["x11", "wayland"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "webgpu"] }

# The web showcase runs through the consolidated `martensite-web` facade
# (canvas lookup, web event loop, WebGPU/WebGL2 probe, font fetch, DOM
# a11y bridge). The event-ledger API used by the dev session lives behind
# martensite-window/devtools (normally pulled in transitively by the
# host-only dev-channel feature) — pull it in directly for the web build.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
martensite-web = { workspace = true }
martensite-window = { workspace = true, features = ["devtools"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Node",
    "Performance",
    "UrlSearchParams",
    "Window",
] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# The dev-channel socket server is host-only (ADR-0038): on wasm it is
# gated out of the facade, so only request the feature on host targets.
martensite = { workspace = true, features = ["dev-channel"] }
# Platform AccessKit bridge — the web target mirrors the tree through
# `martensite-access`'s WebA11yBridge instead.
accesskit_winit = { workspace = true }
pollster = "1.0"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }

[lints]
workspace = true
