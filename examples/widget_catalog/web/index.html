<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Martensite — Widget Catalog</title>
    <!--
      COOP/COEP note: these headers are NOT required — they only matter
      for `crossOriginIsolated` contexts (SharedArrayBuffer / wasm
      threads), which Martensite's single-threaded wasm build does not
      use. If a future multithreaded build needs them, serve with:
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: require-corp
    -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0e0f13;
        color: #c8cad2;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Logical size matches app::LOGICAL_WIDTH/HEIGHT; the wasm side
         scales the backing store by devicePixelRatio. */
      #martensite-canvas {
        display: block;
        width: 1280px;
        height: 860px;
        max-width: 100vw;
        max-height: 100vh;
        outline: none;
      }
      #loading {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        font-size: 14px;
        letter-spacing: 0.02em;
        opacity: 0.9;
        transition: opacity 0.25s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #2a2d38;
        border-top-color: #7aa2f7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      noscript {
        position: absolute;
        padding: 12px 16px;
        border: 1px solid #2a2d38;
        border-radius: 8px;
        background: #15161c;
      }
    </style>
  </head>
  <body>
    <!--
      The winit window binds to this canvas via
      `martensite_window::web::WebWindowAttributes::with_canvas` —
      `martensite_web::canvas_element("martensite-canvas")` looks it up
      by id in `start()`.
    -->
    <div id="app">
      <canvas id="martensite-canvas" width="1280" height="860" tabindex="0"></canvas>
      <div id="loading" aria-hidden="true">
        <div class="spinner"></div>
        <div>Loading the Martensite widget catalog…</div>
      </div>
      <noscript>
        <p>
          The widget catalog needs JavaScript + WebAssembly — enable
          JavaScript and reload.
        </p>
      </noscript>
    </div>
    <script type="module">
      import init from './pkg/widget_catalog.js';
      const loading = document.getElementById('loading');
      try {
        await init();
        // First frames arrive on the next rAF after `start()` returns;
        // fade the splash once the event loop has had a moment.
        setTimeout(() => loading.classList.add('done'), 800);
      } catch (err) {
        loading.innerHTML =
          '<div style="max-width:36em;text-align:center">Failed to start the catalog:<br/><code></code></div>';
        loading.querySelector('code').textContent = String(err);
        console.error(err);
      }
    </script>
  </body>
</html>
