[package]
name = "industrial_dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Industrial dashboard example application for Martensite."
readme = "README.md"
publish = false

[features]
default = []
# Enable the devtools diagnostic HUD pass (`DiagnosticHud`, frame
# histogram). Off by default so the headless example stays quiet; the
# HUD types come from the facade's `martensite::devtools` re-export.
devtools = []
# Passthrough so `Bound<W>` can forward `as_any_mut`/`timemachine_*`
# when the trait exposes them — keeps the wrapper transparent under
# `--all-features` builds.
devtools-timemachine = ["martensite/devtools-timemachine"]

[dependencies]
# Platform video decoders for the media panel — each backend is a no-op
# off its target OS (VT on macOS, MF on Windows, VAAPI on Linux).
martensite = { workspace = true, features = [
    "decoder-videotoolbox",
    "decoder-mf",
    "decoder-vaapi",
] }
# Editor tab buffers resolve through `EmbeddedVfs` — one VFS document
# per `model::SOURCES` entry.
martensite-assets = { workspace = true }
accesskit_winit = { workspace = true }
# Real OS clipboard for the grid context menu — the backend isn't
# `Send`, so it lives app-side and widgets publish payloads via Signal.
martensite-clipboard-platform = { workspace = true }
# The facade has no `vello` passthrough — enabling the GPU glyph/path
# backend requires a direct dep (same as viewport_showcase).
martensite-wgpu = { workspace = true, features = ["vello"] }
# Rubber-band overscroll + spring micro-interactions — the same motion
# crate `ScrollView` dogfoods, driven directly by the panels.
martensite-motion = { workspace = true }
# Fluent bundles for the status-bar locale dropdown — en/es/fr/de
# resources compile in via `include_str!` from `locales/` and switch
# live through `martensite_l10n::reactive::L10n`.
martensite-l10n = { workspace = true }
# App-side OS services — like the clipboard backend, the native halves
# aren't `Send`, so widgets publish request Signals and the app layer
# performs the calls. `platform` compiles the real subprocess backends;
# each falls back to a safe stub where the OS tooling is absent
# (`default_platform_*` never fails).
martensite-persist = { workspace = true }
# `StateStore::set` is generic (`impl Into<serde_json::Value>`), so the
# dashboard's `PrefStore` enum names `Value` directly to implement it.
serde_json = { workspace = true }
martensite-notify = { workspace = true, features = ["platform"] }
martensite-dialog = { workspace = true, features = ["platform"] }
martensite-share = { workspace = true, features = ["platform"] }
martensite-print = { workspace = true, features = ["platform"] }
# winit/wgpu feature pins mirror examples/viewport_showcase — the vendored
# accesskit_winit fork and the wgpu engine both build against these.
winit = { version = "0.31.0-beta.3", default-features = false, features = ["x11", "wayland"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "webgpu"] }
accesskit = { workspace = true }
parking_lot = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
pollster = "1.0"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }

[lints]
workspace = true
