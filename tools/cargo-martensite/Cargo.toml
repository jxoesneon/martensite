[package]
name = "cargo-martensite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Developer CLI toolchain for sub-second hot-reloading and asset compilation."
readme = "README.md"
publish = false

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
fontdb = { workspace = true, features = ["std", "fontconfig"] }
martensite-design-lint = { workspace = true }
martensite-devtools = { workspace = true }
martensite-host = { workspace = true, optional = true, features = ["dev-channel"] }
martensite-mcp = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
semver = "1.0"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tempfile = "3.27"
martensite-host = { workspace = true }
toml = "0.9"

[features]
default = []
## Authenticated loopback WebSocket bridge to a browser-hosted app's dev
## channel (ADR-0042). Opt-in only; never enabled for release installs.
web-dev-channel = ["dep:tokio-tungstenite", "dep:futures-util", "dep:martensite-host"]

[lib]
name = "cargo_martensite"
path = "src/lib.rs"

[lints]
workspace = true
