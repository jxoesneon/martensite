# {{project_name}} — martensite-design-lint configuration (HMI / ISA-101 tuned).
# Documentation: https://martensite.dev/docs/design-standards

# Display scale factor (device px to logical pt conversion).
scale_factor = 1.0

# Base URL or path where finding documentation links resolve.
docs_base = "https://martensite.dev/docs/design-standards"

# Active standards catalogs for UI validation:
# - isa-101: High-Performance HMI visual standards (grayscale base, alarm colors)
# - wcag: WCAG 2.2 AA accessibility (contrast, target sizing, readability)
# - hci-laws: Ergonomic rules (Fitts's law, Hick's law, choice complexity)
# - consistency: Typography scale, padding rhythm, layout alignment
# - perception: Gestalt grouping principles and optical balance
standards = ["isa-101", "wcag", "hci-laws", "consistency", "perception"]

# HMI rule overrides:
[rules.choice-count]
severity = "warn"
max = 7.0

# Scope-name reclassification for dashboard layout mounts:
[classify]
"Zone" = "container"
"Panel" = "container"
"Dock" = "container"

# Path-scoped suppressions:
# [[allow]]
# path = "App/OverviewZone/**"
# rules = ["choice-count"]
