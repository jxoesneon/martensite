# {{project_name}} — Martensite developer toolchain configuration.

[dev]
# Development server port for hot reload coordination.
port = 8765
# MARTENSITE_DEV_CHANNEL=1 auto-serves the dev channel for MCP tooling.
channel = true

[lint]
# Path to design lint configuration.
config = "design-lint.toml"

[inspector]
# Enable devtools HUD and remote inspector in debug builds.
enabled = true
