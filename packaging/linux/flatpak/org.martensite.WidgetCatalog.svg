<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#313244" stroke-width="4" />

  <!-- Grid / Widget Layout Motif -->
  <rect x="76" y="76" width="360" height="48" rx="12" fill="#181825" stroke="#45475a" stroke-width="2" />
  <circle cx="106" cy="100" r="8" fill="#f38ba8" />
  <circle cx="132" cy="100" r="8" fill="#f9e2af" />
  <circle cx="158" cy="100" r="8" fill="#a6e3a1" />

  <!-- Left Sidebar Panel -->
  <rect x="76" y="140" width="100" height="296" rx="16" fill="#181825" stroke="#313244" stroke-width="2" />
  <rect x="92" y="160" width="68" height="12" rx="4" fill="#585b70" />
  <rect x="92" y="184" width="56" height="10" rx="3" fill="#45475a" />
  <rect x="92" y="204" width="64" height="10" rx="3" fill="#45475a" />
  <rect x="92" y="224" width="48" height="10" rx="3" fill="#45475a" />

  <!-- Main Canvas / Crystal Needle Feature -->
  <rect x="192" y="140" width="244" height="296" rx="16" fill="#181825" stroke="#313244" stroke-width="2" />

  <!-- Martensite Needle Lattice Polygonal Motif -->
  <g filter="url(#glow)">
    <!-- Primary Needle -->
    <polygon points="314,168 376,270 340,296 252,220" fill="url(#primaryGrad)" opacity="0.9" />
    <!-- Secondary Cross Shear Needle -->
    <polygon points="236,250 350,370 310,396 220,300" fill="url(#accentGrad)" opacity="0.85" />
    <!-- Central Node Core -->
    <circle cx="294" cy="276" r="20" fill="#ffffff" opacity="0.95" />
    <circle cx="294" cy="276" r="10" fill="#6366f1" />
  </g>

  <!-- Interactive Component Accents -->
  <rect x="212" y="374" width="70" height="26" rx="6" fill="#6366f1" opacity="0.8" />
  <rect x="290" y="374" width="50" height="26" rx="6" fill="#313244" />
</svg>
