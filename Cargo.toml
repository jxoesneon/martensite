# Optional heavy adapters — excluded from the default workspace build.
# They are `publish = false` and are checked/linted/tested by the dedicated
# `adapters` job in `.github/workflows/ci.yml` instead of the workspace jobs.
exclude = [
    "crates/martensite-bevy",
    "crates/martensite-godot",
    "examples/viewport_showcase",
]

# `stubs/martensite` and `stubs/martensite-ui` are NOT workspace members.
# They are `0.0.1` namespace-reservation crates (`publish = false`) used to
# hold the corresponding crates.io package names until the v1.0 release.
# They are not built, tested, or published with the rest of the workspace.

[workspace.package]
version = "0.19.0"
edition = "2021"
rust-version = "1.89.0"
authors = ["Jose Eduardo Rojas Jimenez <joseeduardox@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jxoesneon/martensite"
homepage = "https://martensite.dev"
keywords = ["gui", "ui", "wgpu", "vello", "reactive"]
categories = ["gui", "rendering::graphics-api"]

[workspace.dependencies]
martensite = { version = "0.19.0", path = "crates/martensite" }
martensite-core = { version = "0.19.0", path = "crates/martensite-core" }
