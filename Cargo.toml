[workspace]
resolver = "2"
members = [
    "crates/martensite",
    "crates/martensite-core",
    "crates/martensite-reactive",
    "crates/martensite-layout",
    "crates/martensite-wgpu",
    "crates/martensite-render",
    "crates/martensite-text",
    "crates/martensite-access",
    "crates/martensite-accesskit-winit",
    "crates/martensite-window",
    "crates/martensite-focus",
    "crates/martensite-clipboard",
    "crates/martensite-dnd",
    "crates/martensite-theme",
    "crates/martensite-motion",
    "crates/martensite-media",
    "crates/martensite-media-platform",
    "crates/martensite-history",
    "crates/martensite-assets",
    "crates/martensite-l10n",
    "crates/martensite-devtools",
    "crates/martensite-macros",
    "crates/martensite-test",
    "crates/martensite-blessed",
    "crates/martensite-plugin",
    "crates/martensite-cosmic-text",
    "crates/martensite-font-fallback",
    "crates/martensite-host",
    "crates/martensite-clipboard-platform",
    "crates/martensite-text-reference",
    "crates/martensite-render-test",
    "crates/martensite-media-test",
    "tools/cargo-martensite",
    "examples/industrial_dashboard",
    "benches/bench_suite",
]

# `stubs/martensite` and `stubs/martensite-ui` are NOT workspace members.
# They are `0.0.1` namespace-reservation crates (`publish = false`) used to
# hold the corresponding crates.io package names until the v1.0 release.
# They are not built, tested, or published with the rest of the workspace.

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.89.0"
authors = ["Jose Eduardo Rojas Jimenez <joseeduardox@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jxoesneon/martensite"
homepage = "https://martensite.dev"
keywords = ["gui", "ui", "wgpu", "vello", "reactive"]
categories = ["gui", "rendering::graphics-api"]

[workspace.dependencies]
martensite = { version = "0.11.0", path = "crates/martensite" }
martensite-core = { version = "0.11.0", path = "crates/martensite-core" }
martensite-reactive = { version = "0.11.0", path = "crates/martensite-reactive" }
martensite-layout = { version = "0.11.0", path = "crates/martensite-layout" }
martensite-wgpu = { version = "0.11.0", path = "crates/martensite-wgpu" }
martensite-render = { version = "0.11.0", path = "crates/martensite-render" }
martensite-text = { version = "0.11.0", path = "crates/martensite-text" }
martensite-access = { version = "0.11.0", path = "crates/martensite-access" }
martensite-window = { version = "0.11.0", path = "crates/martensite-window" }
martensite-focus = { version = "0.11.0", path = "crates/martensite-focus" }
martensite-clipboard = { version = "0.11.0", path = "crates/martensite-clipboard" }
martensite-dnd = { version = "0.11.0", path = "crates/martensite-dnd" }
martensite-theme = { version = "0.11.0", path = "crates/martensite-theme" }
martensite-motion = { version = "0.11.0", path = "crates/martensite-motion" }
martensite-media = { version = "0.11.0", path = "crates/martensite-media" }
martensite-media-platform = { version = "0.11.0", path = "crates/martensite-media-platform" }
martensite-history = { version = "0.11.0", path = "crates/martensite-history" }
martensite-assets = { version = "0.11.0", path = "crates/martensite-assets" }
martensite-l10n = { version = "0.11.0", path = "crates/martensite-l10n" }
martensite-devtools = { version = "0.11.0", path = "crates/martensite-devtools" }
martensite-macros = { version = "0.11.0", path = "crates/martensite-macros" }
martensite-test = { version = "0.11.0", path = "crates/martensite-test" }
martensite-blessed = { version = "0.11.0", path = "crates/martensite-blessed" }
martensite-plugin = { version = "0.11.0", path = "crates/martensite-plugin" }
cargo-martensite = { version = "0.11.0", path = "tools/cargo-martensite" }
martensite-cosmic-text = { version = "0.19.0-martensite.1", path = "crates/martensite-cosmic-text" }
martensite-font-fallback = { version = "0.11.0", path = "crates/martensite-font-fallback" }
martensite-clipboard-platform = { version = "0.11.0", path = "crates/martensite-clipboard-platform" }
martensite-host = { version = "0.11.0", path = "crates/martensite-host" }

# Core rendering stack — versions verified against crates.io on 2026-09-06
# wgpu backends are enabled unconditionally; wgpu internally gates them by
# target platform (vulkan on Linux/Android, metal on macOS/iOS, dx12 on
# Windows, webgpu on wasm). Without at least one backend, Instance::default()
# panics, which breaks ignored GPU tests in CI.
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "webgpu"] }
# NOTE: official `vello` 0.10 depends on wgpu 29, which is incompatible with the
# workspace's wgpu 30 (the two major versions cannot coexist as a single type).
# `netrender-vello` is a byte-compatible republish of vello 0.10 built against
# wgpu 30; its library name is `vello`, so all `use vello::…` imports are
# unchanged. This unifies the GPU compute renderer on the same wgpu version as
# the rest of the workspace, allowing `vello::Renderer` to consume the
# `wgpu::Device`/`wgpu::Queue` owned by `GpuContext`.
vello = { package = "netrender-vello", version = "0.10", default-features = false }
taffy = { version = "0.8", default-features = false, features = ["flexbox", "grid", "block_layout", "taffy_tree"] }
cosmic-text = { package = "martensite-cosmic-text", version = "0.19.0-martensite.1", path = "crates/martensite-cosmic-text", default-features = false, features = ["std", "swash"] }
fontdb = { version = "0.24", default-features = false }
accesskit = { version = "0.25" }
accesskit_winit = { package = "martensite-accesskit-winit", path = "crates/martensite-accesskit-winit" }
winit = { version = "0.31.0-beta.3", default-features = false, features = ["x11"] }

# Utility libraries
slotmap = { version = "1.1", features = ["serde"] }
bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
tracing = "0.1.44"
smallvec = { version = "1.13", features = ["union"] }
kurbo = "0.13"
peniko = "0.6"
glam = { version = "0.33", features = ["bytemuck"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
softbuffer = { version = "0.4" }
raw-window-handle = { package = "raw-window-handle", version = "0.6", features = ["std"] }
pollster = "1.0"
parking_lot = "0.12"
unicode-segmentation = "1.13"
fluent-bundle = "0.16"
unic-langid = "0.9"
fluent-langneg = "0.14"
notify = "8.2"
libloading = "0.8"
naga = { version = "30", features = ["wgsl-in"] }
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
unicode-bidi = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
