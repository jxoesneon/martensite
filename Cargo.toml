# Core rendering stack — versions verified against crates.io on 2026-09-06
# wgpu backends are enabled unconditionally; wgpu internally gates them by
# target platform (vulkan on Linux/Android, metal on macOS/iOS, dx12 on
# Windows, webgpu on wasm). Without at least one backend, Instance::default()
# panics, which breaks ignored GPU tests in CI.
# `webgl` is inert on native targets (wgpu's `webgl` cfg is wasm-only) and
# enables the WebGL2 downlevel backend on wasm32. `fragile-send-sync-non-atomic
# -wasm` is wgpu's sanctioned mechanism for `Send`/`Sync` wgpu handle types on
# single-threaded wasm (no `atomics` target-feature); without it every handle
# wraps `Rc`/`RefCell` and downstream `Send + Sync` bounds fail to compile on
# wasm32. Both features are no-ops for the desktop build.
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }
# NOTE: official `vello` 0.10 depends on wgpu 29, which is incompatible with the
# workspace's wgpu 30 (the two major versions cannot coexist as a single type).
# `martensite-vello` is a vendored copy of `netrender-vello` 0.10 — itself a
# republish of vello 0.10 built against wgpu 30; its library
# name is `vello`, so all `use vello::…` imports are unchanged. Vendoring the
# source in-tree removes the single-maintainer republish from the
# registry dependency graph. This unifies the GPU compute renderer on the same
# wgpu version as the rest of the workspace, allowing `vello::Renderer` to
# consume the `wgpu::Device`/`wgpu::Queue` owned by `GpuContext`.
#
# Local divergences from upstream vello 0.10:
# - `render.rs::render_encoding_coarse` scales the coverage-driven bump
#   buffers (blend_spill/ptcl/tiles/seg_counts/segments/bin_data) with the
#   target's tile/bin count. Upstream's fixed estimates silently overflow on
#   dense scenes at HiDPI sizes — `bump.failed` sets STAGE_COARSE and the
#   frame renders empty (the black-window bug).
# - `lib.rs::render_to_texture_async_internal` always downloads the bump
#   buffer (robust) and polls the device so `map_async` resolves under
#   `block_on` — this is what `VelloRenderer::render_to_texture_bump_stats`
#   uses for diagnostics.
vello = { package = "martensite-vello", version = "0.10.0-martensite.1", path = "crates/martensite-vello", default-features = false }
taffy = { version = "=0.14.0", default-features = false, features = ["flexbox", "grid", "block_layout", "taffy_tree"] }
cosmic-text = { package = "martensite-cosmic-text", version = "0.19.0-martensite.2", path = "crates/martensite-cosmic-text", default-features = false, features = ["std", "swash"] }
fontdb = { version = "0.24", default-features = false }
accesskit = { version = "0.25" }
accesskit_winit = { package = "martensite-accesskit-winit", version = "0.19.0", path = "crates/martensite-accesskit-winit" }
winit = { version = "0.31.0-beta.3", default-features = false, features = ["x11", "wayland"] }
# Win32/COM FFI for DWM system materials and Snap Layouts (martensite-shell).
# Version 0.61.3 was published 2025-06-12 (well over 7 days ago).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

# Utility libraries
slab = "0.4"
slotmap = { version = "1.1", features = ["serde"] }
bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
tracing = "0.1.44"
smallvec = { version = "1.13", features = ["union"] }
kurbo = "0.13"
peniko = "0.6"
glam = { version = "0.33", features = ["bytemuck"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
softbuffer = { version = "0.4" }
raw-window-handle = { package = "raw-window-handle", version = "0.6", features = ["std"] }
pollster = "1.0"
parking_lot = "0.12"
unicode-segmentation = "1.13"
fluent-bundle = "0.16"
unic-langid = "0.9"
fluent-langneg = "0.14"
notify = "8.2"
libloading = "0.8"
naga = { version = "30", features = ["wgsl-in"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
unicode-bidi = "0.3"
# Objective-C runtime FFI for the macOS shell backend (NSVisualEffectView
# vibrancy, Liquid Glass). Used by `martensite-shell` under the
# `macos-backend` feature. `objc2` 0.6.4 was published 2025-04-10 (well over
# 7 days ago).
objc2 = "0.6"
# D-Bus IPC for the Wayland shell backend (StatusNotifierItem system tray
# registration). Used by `martensite-shell` under the `wayland-backend` feature,
# cfg-gated to Linux. `zbus` 5.x was published well over 7 days ago.
zbus = { version = "5", default-features = false }

# Web (wasm32-unknown-unknown) bindings — only consumed through
# `cfg(target_arch = "wasm32")` target dependencies in member crates, so
# the desktop build never links them. wasm-bindgen 0.2.128 / web-sys
# 0.3.105 / wasm-bindgen-futures 0.4.78 / js-sys 0.3.105 were published
# 2026-09-04 and are already pinned in the lockfile (used by wgpu and
# winit-web), so no fresh crate enters the graph.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
# panic = "abort" is intentionally omitted: the workspace relies on
# catch_unwind for malformed-font guards and engine panic quarantine
# (martensite-text, martensite::widgets::external). Abort would silently
# disable that hardening. Downstream apps may still choose abort in their
# own profile — it only affects binaries built within this workspace.
strip = true
