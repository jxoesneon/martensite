[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "NOASSERTION",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = [
    { name = "cmake" },
    { name = "cxx-build" },
    { name = "openssl-sys" },
    { name = "freetype-sys" },
    { name = "fontconfig-sys" },
    { name = "shaderc-sys" },
    { name = "glib-sys" },
    { name = "gobject-sys" },
    { name = "atk-sys" },
    { name = "zlib-sys" },
    { name = "libsqlite3-sys" },
]
skip = [
    { name = "libc" },
    { name = "windows-sys" },
    { name = "windows-targets" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
