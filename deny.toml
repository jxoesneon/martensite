[graph]
all-features = true

[advisories]
ignore = [
    "RUSTSEC-2025-0141", # bincode unmaintained (transitive via cosmic-text/syntect)
    "RUSTSEC-2024-0388", # derivative unmaintained (transitive via cosmic-text/syntect)
    "RUSTSEC-2024-0320", # yaml-rust unmaintained (transitive via cosmic-text/syntect)
    "RUSTSEC-2025-0057", # fxhash unmaintained (transitive via wasmtime/fxprof-processed-profile)
    # proc-macro-error is unmaintained but is a transitive dependency of
    # glib-macros 0.18 (gtk-rs-core 0.18), used by the Pango/Cairo reference
    # renderer. No safe upgrade is available within the gtk-rs 0.18 series.
    "RUSTSEC-2024-0370",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "NOASSERTION",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = [
    { name = "cmake" },
    { name = "cxx-build" },
    { name = "openssl-sys" },
    { name = "freetype-sys" },
    { name = "fontconfig-sys" },
    { name = "shaderc-sys" },
    # `atk-sys` remains banned; only Pango/Cairo/GLib are needed for the
    # `martensite-text-reference` external renderer.
    { name = "atk-sys" },
    { name = "zlib-sys" },
    { name = "libsqlite3-sys" },
]
skip = [
    # `netrender-vello` 0.10.0 -> `vello_shaders` 0.10.0 is pinned to `naga ^29.0.3`.
    # `wgpu` 30.0.1 uses `naga` 30.0.1. Unification requires a new `netrender-vello`
    # release or a fork of `vello_shaders`; this exemption documents the constraint.
    { name = "naga", version = "29.0.4" },
    { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
