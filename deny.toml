[graph]
all-features = true

# Zero-vulnerability policy: every advisory category applies to ALL
# dependencies (direct + transitive), and CI runs `cargo deny -D
# warnings check` so even warning-severity hits fail the build. The
# ignore list is expected to stay EMPTY — a new entry requires a
# documented mitigation plan (upgrade, maintained substitute, or
# vendoring).
# History: bincode/derivative/yaml-rust were dropped by removing the
# unused `vi` feature from vendored martensite-cosmic-text;
# proc-macro-error and the glib unsoundness by upgrading
# martensite-text-reference to the gtk-rs 0.22 stack.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "NOASSERTION",
    # ffmpeg-next's crate license; note this covers the Rust bindings only.
    # The decoder-ffmpeg feature links the system FFmpeg libraries, which
    # are LGPL/GPL depending on how the local FFmpeg build was configured —
    # downstream distributors must honor the linked library's terms.
    "WTFPL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = [
    { name = "cmake" },
    { name = "cxx-build" },
    { name = "openssl-sys" },
    { name = "freetype-sys" },
    { name = "fontconfig-sys" },
    { name = "shaderc-sys" },
    # `atk-sys` remains banned; only Pango/Cairo/GLib are needed for the
    # `martensite-text-reference` external renderer.
    { name = "atk-sys" },
    { name = "zlib-sys" },
    { name = "libsqlite3-sys" },
]
skip = [
    # `martensite-vello` 0.10.0 -> `vello_shaders` 0.10.0 is pinned to `naga ^29.0.3`.
    # `wgpu` 30.0.1 uses `naga` 30.0.1. Unification requires an upstream
    # `vello_shaders` release or a fork; this exemption documents the constraint.
    { name = "naga", version = "29.0.4" },
    { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
