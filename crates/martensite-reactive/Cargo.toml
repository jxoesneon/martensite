[package]
name = "martensite-reactive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Fine-grained push-pull reactive signal DAG for Martensite."
readme = "README.md"

[dependencies]
smallvec = { workspace = true }
slotmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
# Records `Signal::set` source writes in a per-runtime [`journal`] with a
# monotonic index, and registers type-erased source accessors so
# `martensite-devtools` snapshots can capture and restore signal values.
# Everything compiles out when disabled — zero production overhead.
devtools-timemachine = []

[lints]
workspace = true
