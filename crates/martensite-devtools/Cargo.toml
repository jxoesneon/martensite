[package]
name = "martensite-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Tracing spans, Tracy/Chrome GPU timestamps, and in-app F12 developer HUD."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
martensite-history = { workspace = true, optional = true }
martensite-reactive = { workspace = true, optional = true }
martensite-layout = { workspace = true, optional = true }
martensite-focus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
martensite-render = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

accesskit = { workspace = true }
bitflags = { workspace = true }
glam = { workspace = true }
martensite-theme = { workspace = true, optional = true }
martensite-design-lint = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Browser-side dev-channel transport leg (ADR-0042). Only consumed when the
# `web-dev-channel` feature is enabled on a wasm32 build; the desktop build
# never links these bindings.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "CloseEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
] }

[dev-dependencies]
glam = { workspace = true }
martensite-reactive = { workspace = true }
martensite-macros = { workspace = true }

[features]
default = ["devtools"]
# In-app widget inspector compiled into debug builds. Zero overhead in release builds.
devtools = [
    "dep:martensite-design-lint",
    "dep:martensite-theme",
    "dep:serde",
    "dep:serde_json",
    "dep:kurbo",
    "dep:martensite-reactive",
    "dep:martensite-layout",
    "dep:martensite-focus",
    "dep:tracing-subscriber",
    "dep:parking_lot",
]
# Enables the `render_hud` method that emits paint commands into a
# `martensite_render::PaintList`. Off by default to avoid pulling the
# render crate into consumers that only want the data model.
render = ["dep:martensite-render", "dep:kurbo", "dep:base64"]
# Hybrid command-ledger + snapshot time-travel debugging. Pulls in
# martensite-history (ChangeOp journal) and martensite-reactive (source
# write journal + signal snapshots) and enables arena snapshots in
# martensite-core. Compiles out entirely when disabled — zero production
# overhead.
devtools-timemachine = [
    "dep:martensite-history",
    "dep:martensite-reactive",
    "dep:parking_lot",
    "martensite-core/devtools-timemachine",
    "martensite-reactive/devtools-timemachine",
]
# Browser-side dev-channel transport leg (ADR-0042): serves dev-channel
# JSON-RPC lines over a client-initiated ws://127.0.0.1 socket to the
# `cargo martensite dev-web` relay. Compiles to nothing on non-wasm targets
# and in any build that does not opt in — release/gh-pages builds are
# unaffected.
web-dev-channel = ["dep:wasm-bindgen", "dep:web-sys", "dep:serde_json"]

[lints]
workspace = true
