[package]
name = "martensite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Generational slotmap arena, widget traits, and node graph for Martensite."
readme = "README.md"

[dependencies]
martensite-reactive = { workspace = true }
taffy = { workspace = true }
accesskit = { workspace = true }
smallvec = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
slotmap = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
# Arena state snapshots (`ArenaState`, `Widget::timemachine_snapshot`/
# `timemachine_restore`, `state_fingerprint`) used by
# `martensite-devtools` time-travel debugging. Compiles out entirely
# when disabled — zero production overhead.
devtools-timemachine = []

[lints]
workspace = true
