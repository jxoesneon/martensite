[package]
name = "martensite-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "First-party Model Context Protocol (MCP) server for AI-assisted Martensite development."
readme = "README.md"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rmcp = { version = "3.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
tracing = { workspace = true }
thiserror = "2"
martensite-core = { workspace = true }
martensite-devtools = { workspace = true }
martensite-design-lint = { workspace = true }
martensite-reactive = { workspace = true }
martensite-access = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
rmcp = { version = "3.3", features = ["client", "transport-io"] }
martensite-host = { workspace = true, features = ["dev-channel"] }

[lints]
workspace = true
