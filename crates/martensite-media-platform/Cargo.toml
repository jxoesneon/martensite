[package]
name = "martensite-media-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Platform-specific zero-copy hardware video surface import (IOSurface, DXGI, dma-buf) for martensite-media."
readme = "README.md"

[dependencies]
wgpu = { workspace = true }

# macOS: IOSurface + Metal interop via the objc2 ecosystem. The `metal`
# feature on wgpu is enabled only here (target-gated) so non-Apple
# targets don't pull in the Metal backend. VideoToolbox decode is
# feature-gated under `decoder-videotoolbox`.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", features = [
    "std",
    "MTLDevice",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTypes",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", features = ["IOSurfaceRef", "objc2"] }
objc2-video-toolbox = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true }

# Windows: DXGI shared handle import (compiles only on Windows). Media
# Foundation + D3D11 decode is feature-gated under `decoder-mf`.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
] }

# Linux: dma-buf import (compiles only on Linux). VAAPI decode is
# feature-gated under `decoder-vaapi` and needs the `libva-dev` system
# package.
[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.12"
cros-libva = { version = "0.0.13", optional = true }

# Software fallback decoder (all platforms). Requires FFmpeg system
# libraries discoverable via pkg-config; feature-gated so the default
# build is unaffected.
[dependencies.ffmpeg-next]
version = "9.0.0"
optional = true

[features]
docs-rs = []
# Hardware/software video decoder backends producing `HardwareHandle`s.
# Each backend is target-gated; enabling a feature on the wrong OS is a
# no-op. `decoder` is the umbrella that enables every backend whose
# system requirements are met.
decoder = []
decoder-videotoolbox = [
    "decoder",
    "dep:objc2-video-toolbox",
    "dep:objc2-core-video",
    "dep:objc2-core-media",
]
decoder-mf = ["decoder"]
decoder-vaapi = ["decoder", "dep:cros-libva"]
decoder-ffmpeg = ["decoder", "dep:ffmpeg-next"]

[package.metadata.docs.rs]
features = ["docs-rs"]

# This crate uses `#![allow(unsafe_code)]` at the crate level because it
# contains platform-specific FFI to IOSurface/Metal (macOS), DXGI/D3D12
# (Windows), and drm/dma-buf (Linux). The workspace-level `unsafe_code =
# "deny"` policy is preserved for all other crates; this is the narrowly
# scoped audited exception, following the same pattern as
# `martensite-font-fallback`.
[lints]
workspace = true
