[package]
name = "martensite-accesskit-winit"
version.workspace = true
authors.workspace = true
license = "Apache-2.0"
description = "Vendored and patched AccessKit winit adapter for winit 0.31.0-beta.3"
categories.workspace = true
keywords = ["gui", "ui", "accessibility", "winit"]
repository.workspace = true
homepage.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "accesskit_winit"
path = "src/lib.rs"

[features]
default = ["accesskit_unix", "async-io"]
async-io = ["accesskit_unix/async-io"]
# Enables the Android `InjectingAdapter` backend (GameActivity only — see
# `platform_impl/android.rs`). The JNI glue lives in
# `martensite-access-platform`, the workspace's audited-unsafe mobile
# FFI crate.
accesskit_android = ["dep:martensite-access-platform"]

[dependencies]
accesskit = { workspace = true }
winit = { workspace = true }
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.0" }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.0" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
accesskit_unix = { version = "0.23.0", optional = true, default-features = false }

# The Android platform adapter delegates to
# `martensite-access-platform::android`, which owns the JNI boundary
# (`accesskit_android`'s `InjectingAdapter` + `embedded-dex`).
[target.'cfg(target_os = "android")'.dependencies]
martensite-access-platform = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
# The `accesskit_ios` `SubclassingAdapter` Objective-C FFI boundary lives in
# `martensite-access-platform` (the workspace's whitelisted-unsafe mobile
# glue crate) rather than in this vendored fork.
martensite-access-platform = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies.softbuffer]
version = "0.4.8"
default-features = false
features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"]

[target.'cfg(target_os = "ios")'.dev-dependencies.softbuffer]
version = "0.4.8"
default-features = false

# Vendored upstream fork — excluded from the semver-checks matrix
# (scripts/workspace-matrix.py) since its API cadence follows upstream.
[package.metadata.ci]
vendored = true
