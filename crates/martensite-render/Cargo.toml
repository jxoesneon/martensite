[package]
name = "martensite-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Hardware-agnostic PaintList command stream and TinySkia CPU fallback backend."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
tiny-skia = { workspace = true }
kurbo = { workspace = true }
softbuffer = { workspace = true }
raw-window-handle = { workspace = true }
# `swash` parses TrueType/OpenType font files and extracts scaled glyph
# outlines as Bézier paths, which the TinySkia backend rasterizes into its
# CPU `Pixmap`. It is a non-optional dependency because the TinySkia fallback
# backend is always available.
swash = "0.2"
peniko = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# Enables the Vello GPU compute backend. This also turns on vello's own `wgpu`
# feature so that `vello::Renderer` is available, and pulls in the workspace
# `wgpu` crate so that `VelloRenderer::render_to_texture` can accept the same
# `wgpu::Device`/`wgpu::Queue`/`wgpu::TextureView` types used by the rest of the
# workspace (both vello and the workspace are unified on wgpu 30).
vello = ["dep:vello", "dep:peniko", "dep:wgpu", "dep:tracing", "vello/wgpu"]

[dev-dependencies]
martensite-test = { workspace = true }
martensite-wgpu = { workspace = true, features = ["vello"] }
wgpu = { workspace = true }

[lints]
workspace = true
