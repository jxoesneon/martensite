[package]
name = "martensite-access-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Platform-specific accessibility FFI glue (accesskit_ios on iOS, accesskit_android on Android) for martensite-access."
readme = "README.md"

[dependencies]
accesskit = { workspace = true }

# iOS: `accesskit_ios` `SubclassingAdapter` — dynamic Objective-C
# subclassing of the winit `UIView` to implement UIAccessibilityContainer.
[target.'cfg(target_os = "ios")'.dependencies]
accesskit_ios = { version = "0.2.0" }

# Android: `accesskit_android`'s `InjectingAdapter` injects an
# accessibility delegate into the GameActivity `InputEnabledSurfaceView`
# via JNI. The `embedded-dex` feature bundles the prebuilt
# `dev.accesskit.android.Delegate` dex bytecode so the class is loaded
# from the crate itself rather than the application package.
# `android-activity` is used only for the `AndroidApp` handle type; the
# version is kept in lockstep with the one winit's `winit-android`
# backend uses so the handle types unify.
[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.8.0", features = ["embedded-dex"] }
# `game-activity` is required (not `native-activity`): `android-activity`
# compiles no activity backend without one of these features, and the
# AccessKit adapter only works on GameActivity (see `src/android.rs`).
android-activity = { version = "0.6", features = ["game-activity"] }

# The iOS smoke test uses `harness = false` so its `main` runs on the real
# main thread — `SubclassingAdapter` unwraps `MainThreadMarker` internally
# and cannot be constructed on a libtest worker thread. It is env-gated
# (`MARTENSITE_IOS_SIM_TESTS=1`) and a no-op otherwise.
[[test]]
name = "ios_adapter"
harness = false
path = "tests/ios_adapter.rs"

[target.'cfg(target_os = "ios")'.dev-dependencies]
accesskit = { workspace = true }
objc2 = "0.5.2"
objc2-foundation = "0.2.2"
objc2-ui-kit = "0.2.2"

# `ndk-context` lets the on-device gate test recover the JavaVM and the
# activity jobject that `android-activity` publishes at process start —
# the same handles `AndroidAdapter::new` receives via `AndroidApp`.
[target.'cfg(target_os = "android")'.dev-dependencies]
ndk-context = "0.1"

[features]
docs-rs = []

[package.metadata.docs.rs]
features = ["docs-rs"]

# This crate uses `#![allow(unsafe_code)]` at the crate level because it
# contains platform-specific FFI to the Objective-C runtime (iOS) and JNI
# (Android) through the AccessKit mobile adapters. The workspace-level
# `unsafe_code = "deny"` policy is preserved for all other crates; this is
# the narrowly scoped audited exception for mobile accessibility glue,
# following the same pattern as `martensite-media-platform` and
# `martensite-clipboard-platform`.
[lints]
workspace = true
