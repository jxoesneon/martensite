[package]
name = "martensite-dnd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Unified internal scenegraph and cross-OS native drag-and-drop subsystem."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
glam = { workspace = true }
bitflags = { workspace = true }
winit = { workspace = true }

# Web backend (`src/web.rs`): HTML5 `DataTransfer` drop-target wiring.
# winit-web does not translate DOM drag events, so listeners are attached
# directly; all safe Rust.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "DataTransfer",
    "DragEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
] }

[lints]
workspace = true
