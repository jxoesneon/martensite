[package]
name = "martensite-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Winit multi-window management, fractional DPI scaling, and decoupled VSync."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
martensite-shell = { workspace = true }
winit = { workspace = true }
slotmap = { workspace = true }
glam = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }

# Android: select winit's GameActivity backend. `NativeActivity` is
# unsupported — IME events are unreliable and the AccessKit adapter
# cannot inject its delegate (see `src/android.rs`). `android-activity`
# is consumed through winit's re-export so versions cannot diverge.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }

# Web backend (`src/web.rs`): DOM canvas binding, backing-store DPI
# scaling, and the hidden-`<input>` IME overlay. wasm-bindgen externs are
# safe Rust — the crate's `#![forbid(unsafe_code)]` still holds.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "Node",
    "Window",
] }

[features]
docs-rs = ["winit/x11"]

[package.metadata.docs.rs]
features = ["docs-rs"]
[lints]
workspace = true
