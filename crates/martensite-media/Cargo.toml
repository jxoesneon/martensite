[package]
name = "martensite-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Zero-copy hardware media surfaces (DXGI, IOSurface, dma-buf) and external 3D interop."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
martensite-media-platform = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

# `martensite-wgpu` depends on this crate as a regular dependency.
# The interop integration tests that previously used `martensite-wgpu`
# have been moved to the `martensite-media-test` crate to avoid a
# circular dev-dependency that prevents crates.io publishing.
[dev-dependencies]

[features]
# Enables `wgpu`'s `noop` backend so the interop tests can construct a
# `wgpu::Device` without a real GPU adapter. Forwarded to the shared
# workspace `wgpu` dependency, which unifies the feature across every
# crate that links it.
test-noop = ["wgpu/noop"]

[lints]
workspace = true
