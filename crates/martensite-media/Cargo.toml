[package]
name = "martensite-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Zero-copy hardware media surfaces (DXGI, IOSurface, dma-buf) and external 3D interop."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
martensite-media-platform = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

# `martensite-wgpu` depends on this crate as a regular dependency.
# The interop integration tests that previously used `martensite-wgpu`
# have been moved to the `martensite-media-test` crate to avoid a
# circular dev-dependency that prevents crates.io publishing.
[dev-dependencies]

[features]
# Enables `wgpu`'s `noop` backend so the interop tests can construct a
# `wgpu::Device` without a real GPU adapter. Forwarded to the shared
# workspace `wgpu` dependency, which unifies the feature across every
# crate that links it.
test-noop = ["wgpu/noop"]
# Decoder backends: forwarded to `martensite-media-platform`. `decoder`
# enables every backend available on the target; the per-backend
# `decoder-*` features enable a single backend each. All are optional so
# the default build has no decoder FFI surface.
decoder = [
    "martensite-media-platform/decoder-videotoolbox",
    "martensite-media-platform/decoder-mf",
    "martensite-media-platform/decoder-vaapi",
    "martensite-media-platform/decoder-ffmpeg",
]
decoder-videotoolbox = ["martensite-media-platform/decoder-videotoolbox"]
decoder-mf = ["martensite-media-platform/decoder-mf"]
decoder-vaapi = ["martensite-media-platform/decoder-vaapi"]
decoder-ffmpeg = ["martensite-media-platform/decoder-ffmpeg"]

[lints]
workspace = true
