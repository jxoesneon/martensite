[package]
name = "martensite-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Zero-copy hardware media surfaces (DXGI, IOSurface, dma-buf) and external 3D interop."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

# Dev-dependencies form a cycle: `martensite-wgpu` and
# `martensite-media-platform` both depend on this crate as a regular
# dependency, while this crate pulls them in as dev-dependencies for the
# interop integration tests. Cargo permits cycles through dev-dependencies,
# so the interop tests can exercise `VideoProcessor` and the platform import
# functions without adding a regular (non-cyclic) dependency edge.
[dev-dependencies]
martensite-wgpu = { workspace = true }
martensite-media-platform = { workspace = true }

[features]
# Enables `wgpu`'s `noop` backend so the interop tests can construct a
# `wgpu::Device` without a real GPU adapter. Forwarded to the shared
# workspace `wgpu` dependency, which unifies the feature across every
# crate that links it.
test-noop = ["wgpu/noop"]

[lints]
workspace = true
