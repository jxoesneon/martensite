[package]
name = "martensite-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Native operating system accessibility integration via AccessKit."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }
glam = { workspace = true }

# Android: `accesskit_winit`'s `accesskit_android` feature selects the
# `InjectingAdapter` backend (the JNI glue lives in the audited-unsafe
# `martensite-access-platform` crate), and winit's `android-game-activity`
# feature selects the GameActivity backend the adapter requires —
# `NativeActivity` is unsupported.
[target.'cfg(target_os = "android")'.dependencies]
accesskit_winit = { workspace = true, features = ["accesskit_android"] }
winit = { workspace = true, features = ["android-game-activity"] }

# Web accessibility bridge (`src/web.rs`): hidden-DOM/ARIA live-region
# announcer + focusable-role DOM mirror translating AccessKit
# `TreeUpdate`s. wasm-bindgen externs are safe Rust — no unsafe boundary.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "Node",
    "Window",
] }
# accesskit 0.25 depends on uuid (default-features = false); on
# wasm32-unknown-unknown uuid refuses to compile without an explicit RNG
# source. `js` routes through wasm-bindgen — already in this dep set.
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
martensite-text = { workspace = true }

[features]
docs-rs = []

[package.metadata.docs.rs]
features = ["docs-rs"]
[lints]
workspace = true
