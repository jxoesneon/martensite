[package]
name = "martensite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "A retained-mode, GPU-accelerated graphical user interface framework for Rust."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
martensite-reactive = { workspace = true }
martensite-layout = { workspace = true }
martensite-wgpu = { workspace = true }
martensite-render = { workspace = true }
martensite-text = { workspace = true }
martensite-access = { workspace = true }
martensite-window = { workspace = true }
martensite-focus = { workspace = true }
martensite-clipboard = { workspace = true, features = ["platform"] }
martensite-sanitize = { workspace = true }
martensite-dnd = { workspace = true }
martensite-theme = { workspace = true }
martensite-motion = { workspace = true }
martensite-history = { workspace = true }
martensite-assets = { workspace = true }
martensite-webview = { workspace = true }
martensite-webview-platform = { workspace = true }
martensite-pdf = { workspace = true, features = ["platform"] }
martensite-l10n = { workspace = true }
martensite-media = { workspace = true }
martensite-engine-bridge = { workspace = true }
martensite-macros = { workspace = true }
martensite-blessed = { workspace = true }
martensite-shell = { workspace = true }
martensite-devtools = { workspace = true }
martensite-design-lint = { workspace = true }
# Optional: OS-native font fallback providers (DirectWrite, CoreText, Fontconfig).
martensite-font-fallback = { workspace = true, optional = true }
# Optional: dev-channel IPC server (ADR-0038) for devtools/MCP attach.

accesskit = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
taffy = { workspace = true }
parking_lot = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
martensite-test = { workspace = true }
tiny-skia = { workspace = true }

# `martensite-plugin` pulls wasmtime (the plugin host runtime), which
# cannot build for wasm32-unknown-unknown — plugins are host-side.
# Dev-channel IPC server is host-only; gated to the same targets on which
# martensite-host itself carries the dev_channel modules.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
martensite-host = { workspace = true, optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
martensite-plugin = { workspace = true }

[features]
default = []
docs-rs = [
    "martensite-window/docs-rs",
    "martensite-text/docs-rs",
    "martensite-access/docs-rs",
]
# Enable OS-native font fallback providers (DirectWrite on Windows,
# CoreText on macOS, Fontconfig on Linux). When disabled, the static
# PlatformCascadeResolver is used instead.
native-fallback = ["dep:martensite-font-fallback"]
# Headless `wgpu::Device::noop` for tests exercising Engine::render /
# ExternalEngines::render_frame without a real GPU.
test-noop = [
    "martensite-engine-bridge/test-noop",
    "martensite-wgpu/test-noop",
]
# Hardware/software video decode backends for `MediaView` (v0.16.0).
# `decoder` enables every backend available on the target; each
# `decoder-*` feature enables one backend. `decoder-ffmpeg` requires
# FFmpeg system libraries (pkg-config); `decoder-vaapi` requires
# `libva-dev` on Linux. All are forwarded to `martensite-media` and are
# off by default.
decoder = ["martensite-media/decoder"]
decoder-videotoolbox = ["martensite-media/decoder-videotoolbox"]
decoder-mf = ["martensite-media/decoder-mf"]
decoder-vaapi = ["martensite-media/decoder-vaapi"]
decoder-ffmpeg = ["martensite-media/decoder-ffmpeg"]
# Dev-channel IPC server for devtools and MCP attach (ADR-0038). Exposes
# `martensite::dev_channel`; set MARTENSITE_DEV_CHANNEL=1 in a debug build
# to serve the session socket.
dev-channel = [
    "dep:martensite-host",
    "martensite-host/dev-channel",
    "martensite-devtools/devtools",
    # The channel's event-ledger surface needs the router recording —
    # `EventRouter::event_ledger` lives behind this flag.
    "martensite-window/devtools",
]
# Time-travel debugging state capture (martensite-devtools). Mirrors
# martensite-core's feature so widget wrappers built on the facade
# can forward the timemachine hooks correctly.
devtools-timemachine = [
    "martensite-core/devtools-timemachine",
    "martensite-devtools/devtools-timemachine",
]

[package.metadata.docs.rs]
features = ["docs-rs"]
[lints]
workspace = true
