[package]
name = "martensite-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
description = "Virtual file system (VFS), AOT naga shader validation, and dynamic texture streaming."
readme = "README.md"

[dependencies]
martensite-core = { workspace = true }
naga = { workspace = true }
# File watching for Disk backend (optional, only needed in debug/dev)
notify = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27"

[features]
default = ["disk"]
disk = ["dep:notify", "dep:parking_lot"]

[lints]
workspace = true
