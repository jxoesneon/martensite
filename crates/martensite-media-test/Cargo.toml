[package]
name = "martensite-media-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Integration tests for martensite-media that require martensite-wgpu (not published)."
publish = false

[dependencies]
martensite-media = { workspace = true }
martensite-media-platform = { workspace = true }

[dev-dependencies]
martensite-wgpu = { workspace = true }
wgpu = { workspace = true }

[features]
# Enables `wgpu`'s `noop` backend so the interop tests can construct a
# `wgpu::Device` without a real GPU adapter.
test-noop = ["wgpu/noop"]

[lints]
workspace = true
